x-server-base: &server-base
  build: ./server
  command: ["python", "-m", "app.server"]
  restart: unless-stopped
  depends_on:
    - broker
    - pubsub-proxy
    - reference
  environment: &server-env
    PYTHONUNBUFFERED: "1"
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    BROKER_ENDPOINT: tcp://broker:5556
    PUBSUB_PUBLISH_ENDPOINT: tcp://pubsub-proxy:5557
    PUBSUB_SUBSCRIBE_ENDPOINT: tcp://pubsub-proxy:5558
    REFERENCE_ENDPOINT: tcp://reference:5559
    PEER_BIND_ENDPOINT: "tcp://*:5560"
    DATABASE_PATH: /data/messages.db
    HEARTBEAT_EVERY_MESSAGES: ${HEARTBEAT_EVERY_MESSAGES:-10}
    HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-60}
    CLOCK_SYNC_EVERY_MESSAGES: ${CLOCK_SYNC_EVERY_MESSAGES:-15}
    REPLICATION_RETRY_SECONDS: ${REPLICATION_RETRY_SECONDS:-3}

x-client-base: &client-base
  build: ./client
  command: ["node", "index.js"]
  restart: unless-stopped
  depends_on:
    - server-1
    - server-2
  environment: &client-env
    BROKER_ENDPOINT: tcp://broker:5555
    PUBSUB_ENDPOINT: tcp://pubsub-proxy:5558
    BOT_MIN_CHANNELS: ${BOT_MIN_CHANNELS:-5}
    BOT_MIN_SUBSCRIPTIONS: ${BOT_MIN_SUBSCRIPTIONS:-3}
    BOT_MESSAGES_PER_BATCH: ${BOT_MESSAGES_PER_BATCH:-10}
    BOT_MESSAGE_INTERVAL_SECONDS: ${BOT_MESSAGE_INTERVAL_SECONDS:-1}
    BOT_RETRY_INTERVAL_SECONDS: ${BOT_RETRY_INTERVAL_SECONDS:-2}

services:
  broker:
    build: ./server
    command: ["python", "-m", "app.broker"]
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_BIND: "tcp://*:5555"
      BACKEND_BIND: "tcp://*:5556"

  pubsub-proxy:
    build: ./server
    command: ["python", "-m", "app.proxy"]
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      XSUB_BIND: "tcp://*:5557"
      XPUB_BIND: "tcp://*:5558"

  reference:
    build: ./server
    command: ["python", "-m", "app.reference"]
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REFERENCE_BIND: "tcp://*:5559"
      HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-60}

  server-1:
    <<: *server-base
    environment:
      <<: *server-env
      SERVER_NAME: server-1
      PEER_ENDPOINT: tcp://server-1:5560
    volumes:
      - server-1-data:/data

  server-2:
    <<: *server-base
    environment:
      <<: *server-env
      SERVER_NAME: server-2
      PEER_ENDPOINT: tcp://server-2:5560
    volumes:
      - server-2-data:/data

  bot-1:
    <<: *client-base
    environment:
      <<: *client-env
      BOT_NAME: bot-1

  bot-2:
    <<: *client-base
    environment:
      <<: *client-env
      BOT_NAME: bot-2

volumes:
  server-1-data:
  server-2-data:
